<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Segurança e proteção de dados OZAPTECONTA</title>
  <desc id="desc">Ilustração de escudo, cadeado e conversas protegidas no WhatsApp</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="640" height="520" rx="24" fill="url(#bg)"/>

  <!-- Círculos decorativos -->
  <circle cx="90" cy="90" r="56" fill="#22c55e" opacity="0.12"/>
  <circle cx="560" cy="420" r="72" fill="#22c55e" opacity="0.1"/>
  <circle cx="520" cy="80" r="36" fill="#fff" opacity="0.06"/>

  <!-- Celular / WhatsApp -->
  <g transform="translate(72 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="340" rx="28" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
    <rect x="16" y="48" width="168" height="260" rx="12" fill="#14532d"/>
    <rect x="28" y="72" width="110" height="36" rx="10" fill="#fff" opacity="0.92"/>
    <rect x="62" y="120" width="96" height="32" rx="10" fill="#22c55e" opacity="0.85"/>
    <rect x="28" y="168" width="120" height="32" rx="10" fill="#fff" opacity="0.92"/>
    <rect x="48" y="216" width="88" height="32" rx="10" fill="#22c55e" opacity="0.85"/>
    <circle cx="100" cy="28" r="6" fill="#22c55e"/>
    <text x="100" y="32" text-anchor="middle" fill="#0f172a" font-family="system-ui,sans-serif" font-size="8" font-weight="700">•</text>
  </g>

  <!-- Escudo central -->
  <g transform="translate(248 108)" filter="url(#shadow)">
    <path d="M 72 0 L 144 28 L 144 100 C 144 156 108 196 72 220 C 36 196 0 156 0 100 L 0 28 Z" fill="url(#shield)"/>
    <path d="M 48 98 L 64 118 L 104 72" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cadeado -->
  <g transform="translate(430 300)" filter="url(#shadow)">
    <rect x="24" y="48" width="72" height="64" rx="12" fill="#fbbf24"/>
    <path d="M 36 48 L 36 32 C 36 12 52 0 60 0 C 68 0 84 12 84 32 L 84 48" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
    <circle cx="60" cy="80" r="8" fill="#92400e"/>
    <rect x="54" y="80" width="12" height="20" rx="4" fill="#92400e"/>
  </g>

  <!-- Ícones dados -->
  <g fill="#fff" opacity="0.9" font-family="system-ui,sans-serif" font-size="13" font-weight="600">
    <text x="320" y="468" text-anchor="middle" fill="#bbf7d0">Criptografia • Privacidade • Controle total</text>
  </g>
</svg>
