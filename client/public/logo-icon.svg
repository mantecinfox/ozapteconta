<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Anel externo verde -->
  <circle cx="50" cy="50" r="48" fill="url(#outerGrad)" filter="url(#sh)"/>

  <!-- Círculo interno branco -->
  <circle cx="50" cy="50" r="40" fill="white"/>

  <!-- Gráfico de barras verde -->
  <rect x="26" y="58" width="8" height="16" rx="2" fill="#16A34A"/>
  <rect x="38" y="50" width="8" height="24" rx="2" fill="#22C55E"/>
  <rect x="50" y="42" width="8" height="32" rx="2" fill="#16A34A"/>

  <!-- Seta diagonal subindo -->
  <polyline points="44,36 66,26 66,42" fill="none" stroke="#15803D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="44" y1="56" x2="66" y2="26" stroke="#15803D" stroke-width="5" stroke-linecap="round"/>

  <!-- Checkmark pequeno no canto superior esquerdo -->
  <circle cx="28" cy="30" r="10" fill="#22C55E"/>
  <polyline points="23,30 27,34 34,25" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
