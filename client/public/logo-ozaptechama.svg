<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo com gradiente -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Círculo branco ao redor (background) -->
  <circle cx="60" cy="60" r="50" fill="white" filter="url(#shadow)"/>
  
  <!-- Círculo principal com gradiente -->
  <circle cx="60" cy="60" r="45" fill="url(#logoGradient)"/>
  
  <!-- Checkmark -->
  <path d="M 45 60 L 55 70 L 75 50" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Seta subindo -->
  <path d="M 70 45 L 75 35 M 75 35 L 80 45 M 75 35 L 75 65" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Texto OZAPTECHAMA -->
  <text x="130" y="75" font-family="Poppins, sans-serif" font-size="48" font-weight="700" fill="#0F4C3A" letter-spacing="-1">
    OZAPTECHAMA
  </text>
</svg>